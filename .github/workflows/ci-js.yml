name: CI JS

on:
  push:
    branches: [master]
    paths:
      - "chisel_js/**"
      - "skills/**"
      - ".github/workflows/ci-js.yml"
  pull_request:
    branches: [master]
    paths:
      - "chisel_js/**"
      - "skills/**"
      - ".github/workflows/ci-js.yml"
  release:
    types: [published]

jobs:
  javascript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chisel_js
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install
      - name: Test
        run: bun test --coverage
      - name: Self Check
        run: bun run src/chisel/cli/main.ts check .
      - name: Build
        run: bun build ./src/chisel/cli/main.ts --target=node --outdir=./dist --external typescript --external svelte
      - uses: actions/upload-artifact@v4
        with:
          name: dist-js
          path: chisel_js/dist/

  publish-js:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [javascript]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Update npm
        run: npm install -g npm@latest
      - uses: actions/download-artifact@v4
        with:
          name: dist-js
          path: chisel_js/dist/
      - name: Publish
        working-directory: chisel_js
        run: npm publish --access public
