name: docs

on:
  push:
    branches: [master]
    paths:
      - docs/**
      - constraints.md
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - constraints.md
      - .github/workflows/docs.yml
  workflow_dispatch:

# Allow the deploy job to publish via the GitHub Pages Actions deployment API.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # On pull requests: build the site as a check, but don't deploy.
  check:
    name: Build docs (no deploy)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run build

      - uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: docs/dist
          retention-days: 7

  # On push to master: build and deploy via GitHub Pages.
  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: withastro/action@v6
        with:
          path: docs
          node-version: 22
          package-manager: bun

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
