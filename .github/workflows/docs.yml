name: docs

on:
  push:
    branches: [master]
    paths:
      - docs/**
      - constraints.md
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - constraints.md
      - .github/workflows/docs.yml
  workflow_dispatch:

# Allow the deploy job to push to the gh-pages branch.
permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # On pull requests: build the site as a check, but don't deploy.
  check:
    name: Build docs (no deploy)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run build

      - uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: docs/dist
          retention-days: 7

  # On push to master: build and push to the gh-pages branch.
  deploy:
    name: Deploy to gh-pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: withastro/action@v0
        with:
          path: docs
          node-version: 22
          deploy-branch: gh-pages