name: CI Python

on:
  push:
    branches: [master]
    paths:
      - "chisel_py/**"
      - "skills/**"
      - ".github/workflows/ci-python.yml"
  pull_request:
    branches: [master]
    paths:
      - "chisel_py/**"
      - "skills/**"
      - ".github/workflows/ci-python.yml"
  release:
    types: [published]

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chisel_py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest tests/ -q
      - name: Self Check
        run: chisel check . --strict
      - name: Build
        run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist-py
          path: chisel_py/dist/

  publish-py:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [python]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-py
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
