repos:
  - repo: local
    hooks:
      - id: chisel-py
        name: chisel (Python)
        entry: chisel check chisel_py --strict
        language: python
        language_version: python3.12
        additional_dependencies:
          - grimp>=3.0
          - radon>=6.0
          - typer>=0.12
          - rich>=13.0
        files: ^chisel_py/src/.*\.py$
        pass_filenames: false
        always_run: true

      - id: chisel-js
        name: chisel (TypeScript)
        entry: bun run src/chisel/cli/main.ts check .
        language: system
        files: ^(chisel_js/src/.*\.ts|chisel_js/.*\.svelte)$
        pass_filenames: false
        always_run: true
